name: Test

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

# Cancel currently running workflow when a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Run Linter & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'

      - name: Set-up Flutter
        run: |
          flutter config --no-analytics
          dart --disable-analytics

      - name: Install Melos
        uses: bluefireteam/melos-action@2982f8e4fc92440a219490009d6d05195cb1a6a5
        with:
          melos-version: '7.4.0'
          run-bootstrap: false

      - name: Bootstrap
        uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 5
          max_attempts: 5
          delay_seconds: 5
          command: melos bootstrap

      - name: Run linter
        run: melos lint:diff

      - name: Run unit tests
        run: melos test:diff
